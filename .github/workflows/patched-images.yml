name: Build patched Nginx Proxy Manager

on:
  push:
    branches: [http2-backport]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested images to Docker Hub
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: patched-nginx-images

env:
  NPM_VERSION: 2.17.0
  NPM_SOURCE_COMMIT: 5c8aec9bdeca0a2fb6a71e060ec598aa6eddd186
  PATCH_REVISION: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out patched base
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out Nginx Proxy Manager
        uses: actions/checkout@v6
        with:
          repository: NginxProxyManager/nginx-proxy-manager
          ref: ${{ env.NPM_SOURCE_COMMIT }}
          path: npm-source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Build the frontend
        working-directory: npm-source/frontend
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile
          yarn locale-compile
          yarn build

      - name: Set up QEMU
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/http2-backport'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image build metadata
        run: echo "BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_ENV"

      - name: Build and smoke-test the full image
        run: |
          docker buildx bake -f docker/docker-bake.hcl -f docker/docker-bake.npm.hcl \
            --set '*.platform=linux/amd64' --set 'proxy-manager.tags=npm-http2-ci:smoke' \
            --load proxy-manager
          container_id=$(docker run --detach --env DISABLE_IPV6=true npm-http2-ci:smoke)
          trap 'docker rm --force --volumes "$container_id" >/dev/null' EXIT
          docker exec "$container_id" nginx -v
          for attempt in {1..60}; do
            if docker exec "$container_id" check-health; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$container_id" >&2
          exit 1

      - name: Log in to Docker Hub
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/http2-backport'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish amd64 and arm64 images
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/http2-backport'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          export IMAGE="${DOCKERHUB_IMAGE:-${DOCKERHUB_USERNAME}/nginx-proxy-manager}"
          docker buildx bake -f docker/docker-bake.hcl -f docker/docker-bake.npm.hcl \
            --push certbot-node proxy-manager
          {
            echo 'Published Nginx Proxy Manager and its patched base.'
            printf '\n\x60%s\x60\n' "$IMAGE:latest" "$IMAGE:$NPM_VERSION-http2-$PATCH_REVISION" \
              "$IMAGE:certbot-node" "$IMAGE:certbot-node-$PATCH_REVISION"
          } >> "$GITHUB_STEP_SUMMARY"
